name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin.json
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          echo "plugin.json is valid JSON"
          # TODO: when an authoritative plugin.json JSON Schema URL stabilizes, add a schema-validation step.
      - name: Validate marketplace.json
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          echo "marketplace.json is valid JSON"
      - name: Print version
        run: python3 -c "import json; d=json.load(open('.claude-plugin/plugin.json')); print('version:', d['version'])"

  validate-required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required files exist
        run: |
          REQUIRED=(
            README.md LICENSE INTEGRATION.md CHANGELOG.md CONTRIBUTING.md
            SECURITY.md CODE_OF_CONDUCT.md
            .claude-plugin/plugin.json .claude-plugin/marketplace.json
            commands/mozart.md agents/mozart.md agents/PIPELINE.md agents/LEARNINGS.md
            # The bundled manual (14 files). ENUMERATED, NOT DERIVED, and deliberately:
            # a required-files check whose list is read from the tree it checks asserts
            # that the files which exist, exist - the same self-referential vacuity as a
            # population counted from the table it validates. This list is an INDEPENDENT
            # statement of what must be present. Drift in the other direction (a new
            # manual file that never reaches this list) is caught by V24_docs, which
            # compares BOTH required-file lists against check-manual-bundle.py's MANUAL
            # constant - not against `ls agents/*.md`. V16's and V20's floors do not close
            # it: a 15th manual file would clear both while reaching neither list.
            agents/INDEX.md agents/DELIVER.md agents/STATE.md agents/TICKETS.md
            agents/INTAKE.md agents/WORKTREES.md agents/FLOWS.md agents/OPERATE.md
            agents/INCIDENT.md agents/COUNTERPOINT.md agents/EVAL.md agents/DIAGNOSE.md
            agents/AUDIT.md agents/CONTEXT-BUDGET.md
            # The templates (5 files): not manual members, so not in MANUAL, but the
            # manual tells the conductor to copy them. check-manual-bundle.py's
            # ON_DEMAND (V26_ondemand) compares this list against its own constant.
            agents/TEMPLATE-STATE.md agents/TEMPLATE-LEDGER.md agents/TEMPLATE-CONDUCTOR.md
            agents/TEMPLATE-FLOW.md agents/TEMPLATE-REPORT.md
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $f"
            fi
          done
          [ $MISSING -eq 0 ] || { echo "$MISSING required file(s) missing"; exit 1; }

  validate-contract-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default shallow checkout is deliberate. The full clone that used to live
      # here existed ONLY so the carve conservation gate could resolve its pre-carve
      # baseline with `git show <BASE_SHA>:agents/mozart.md`; that gate
      # (V17_carve_phase) was retired 2026-09-19 under D9 of
      # 2026-09-19-deliver-nina-cloud-persona, and nothing this job runs reads git
      # history any more - the gates use `git ls-files` and `git rev-parse
      # --show-toplevel`, and the surviving self-test runs on a synthetic fixture.
      # Measured, not assumed: the whole suite is green in a tree with exactly one
      # commit and no BASE_SHA object, and the same tree BEFORE the retirement fails
      # V17_carve_phase on baseline resolution. Restore `fetch-depth: 0` if a future
      # gate reads history. The old comment also asserted a `--no-ff` merge
      # requirement to keep the baseline object reachable; that constraint died with
      # the gate and is not a live requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax-check the gate script
        run: bash -n scripts/mozart-contract-gates.sh
      - name: Run persona-contract gates
        run: bash scripts/mozart-contract-gates.sh
      - name: Carve conservation self-test (12 mutations, synthetic fixture)
        run: python3 scripts/check-carve-conservation.py --self-test
      # scripts/mozart-lint.sh is deliberately NOT wired here: it reads .mozart/,
      # which is gitignored and therefore absent from every CI checkout, so the
      # job would pass vacuously on every run - a green light powered by an empty
      # directory. That is the exact defect class this campaign exists to remove
      # (see mozart-contract-gates.sh's own Rule 1 and the V0 gate family), so it
      # stays a local-only check run from a checkout that actually has campaign
      # state, not a CI step.

  validate-resources-macos:
    # The production interpreter on macOS is the system /usr/bin/python3 (3.9), the
    # floor every script under scripts/ is written to. Run the checker with it,
    # under `env -i` and `-I`, exactly as a user's launcher would. Only if the runner
    # image's system Python is not 3.9 does the job fall back to setup-python 3.9
    # (python-versions ships a 3.9 arm64 build for darwin, 3.9.13 at the time of
    # writing). The second step runs the same checker under the runner's own python3
    # (the newest the image offers, or the 3.9 the fallback installed), so an
    # interpreter newer than the floor is covered too. --timing only reports the cost
    # of each gate; it never fails the job (--enforce-ceilings is the opt-in that does).
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the system Python
        id: system-python
        run: |
          # A missing binary or a failing shim must route to setup-python, not kill this step (bash -e).
          /usr/bin/python3 --version 2>&1 || true
          if /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 9) else 1)' 2>/dev/null; then
            echo "is39=true" >> "$GITHUB_OUTPUT"
          else
            echo "is39=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Python 3.9 (the system Python is not 3.9)
        if: steps.system-python.outputs.is39 != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Resource checker under the system Python
        timeout-minutes: 2
        if: steps.system-python.outputs.is39 == 'true'
        run: /usr/bin/env -i /usr/bin/python3 -I scripts/check-resources.py --timing --deadline 180
      - name: Resource checker under Python 3.9 (fallback)
        timeout-minutes: 2
        if: steps.system-python.outputs.is39 != 'true'
        run: /usr/bin/env -i "$(command -v python3)" -I scripts/check-resources.py --timing --deadline 180
      - name: Resource checker under the runner's python3
        timeout-minutes: 2
        run: python3 -I scripts/check-resources.py --timing --deadline 180
